# No repository is authorized until explicitly added below.
timezone = "Asia/Singapore"
codex_version = "0.140.0"
# model = "your available Codex model"  # otherwise use the account default

[limits]
attempts_per_day = 3
prs_per_day = 1
task_seconds = 1800
model_seconds_per_day = 7200
revisions_per_pr = 2
open_prs = 3
max_files = 5
max_lines = 200

[discovery]
min_stars = 500
pushed_days = 30
max_repositories = 50
issues_per_repo = 10
interval_seconds = 3600
watch_seconds = 600

