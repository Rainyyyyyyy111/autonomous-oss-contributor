name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.1"
          python-version: ${{ matrix.python }}
          enable-cache: false
      - run: uv sync --locked --extra dev
      - run: uv run ruff check src tests scripts
      - run: uv run mypy src/oss_contributor
      - run: uv run pytest -q
      - run: uv build
      - run: uv run python scripts/smoke_wheel.py

  docker:
    name: Docker isolation and red-green verification
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: false
      - run: uv sync --locked --extra dev
      - run: docker build -t oss-contributor-runner:0.1 src/oss_contributor/runtime
      - run: uv run pytest tests/test_docker.py -q
        env:
          OSS_TEST_DOCKER: "1"
